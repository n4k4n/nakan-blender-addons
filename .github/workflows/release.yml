# Every push to main checks each add-on's version (bl_info or blender_manifest.toml).
# When an add-on has a version with no Release yet, its download is built and published
# as the Release <folder>-v<version>. To release an update, just bump the version.
name: Release add-ons

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build new releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/build_releases.py > releases.tsv

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r tag title; do
            [ -n "$tag" ] || continue
            gh release create "$tag" dist/"$tag"/* --target "$GITHUB_SHA" --title "$title" \
              --notes "Install with Edit > Preferences > Add-ons > Install from Disk and pick the downloaded file. See the add-on's README for details."
          done < releases.tsv
